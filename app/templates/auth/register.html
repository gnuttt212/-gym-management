{% extends 'base.html' %}
{% block title %}Đăng ký hội viên{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card shadow">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">
                <i class="bi bi-heart-pulse text-danger"></i> Đăng ký hội viên
            </h3>
            <p class="text-center text-muted">
                Chức năng đăng ký trực tuyến sẽ được triển khai trong giai đoạn tiếp theo.
            </p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary w-100">
                <i class="bi bi-arrow-left"></i> Quay lại đăng nhập
            </a>
        </div>
    </div>
</div>
{% endblock %}
